[project]
name = "warehouse-cost-audit"
version = "0.1.0"
description = "Find what makes a Snowflake or Redshift bill expensive, from a CSV export of query history, with an estimated saving per finding."
requires-python = ">=3.12"
dependencies = ["sqlglot>=25"]

[project.scripts]
costaudit = "costaudit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costaudit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
